version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contexthub-db
    environment:
      POSTGRES_DB: contexthub
      POSTGRES_USER: contexthub
      POSTGRES_PASSWORD: contexthub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
